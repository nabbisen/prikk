[workspace]
resolver = "3"
members = [
    "crates/prikk-cli",
    "crates/prikk-error",
    "crates/prikk-hash",
    "crates/prikk-object",
    "crates/prikk-store",
]

[workspace.package]
version         = "0.0.1"
edition         = "2024"
rust-version    = "1.85"
license             = "Apache-2.0"
authors             = ["nabbisen"]
repository          = "https://github.com/nabbisen/prikk"
categories          = []
keywords            = []

[workspace.dependencies]
prikk-error                 = { version = "0", path = "crates/prikk-error" }
prikk-hash                  = { version = "0", path = "crates/prikk-hash" }
prikk-object                = { version = "0", path = "crates/prikk-object" }
prikk-store                 = { version = "0", path = "crates/prikk-store" }

[workspace.lints.rust]
unsafe_code         = "forbid"
missing_docs        = "warn"

[workspace.lints.clippy]
unwrap_used         = "warn"
expect_used         = "warn"
indexing_slicing    = "warn"
