name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Each target's build command is written out in full, rather than interpolating
      # matrix.target, so `tools/release-policy`'s publication-boundary scanner can verify it
      # by exact match (see procedure.rs's cargo() allowlist) instead of trusting a template.
      - name: Build (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target x86_64-unknown-linux-gnu --locked
      - name: Build (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target aarch64-unknown-linux-gnu --locked

      # Repository mutation is Linux-only (DC-37); both matrix targets are Linux, so no
      # download-surface mutation-limit statement is needed for these artifacts.
      - name: Package
        run: |
          target="${{ matrix.target }}"
          asset="prikk-${target}"
          bin="target/${target}/release/prikk"

          mkdir -p stage dist
          cp "$bin" stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf "dist/${asset}.tar.gz" prikk LICENSE
          ( cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )

          echo "target: ${target}" > "dist/${asset}.build-info.txt"
          echo "commit: ${GITHUB_SHA}" >> "dist/${asset}.build-info.txt"
          echo "tag: ${GITHUB_REF_NAME}" >> "dist/${asset}.build-info.txt"
          echo "build: cargo build -p prikk --release --target <target, above> --locked" >> "dist/${asset}.build-info.txt"
          rustc -vV >> "dist/${asset}.build-info.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: prikk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.build-info.txt --repo "${{ github.repository }}" --title "$TAG" --notes-file .github/release-notes-template.md
