name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Every command below is written out per target in full, rather than interpolating
      # matrix.target, so `tools/release-policy`'s publication-boundary scanner can verify each
      # by exact match (procedure.rs) instead of trusting a template — required for cargo, tar,
      # and rustc, which are not in the scanner's dynamic-argument-tolerant inert set.
      - name: Build (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target x86_64-unknown-linux-gnu --locked
      - name: Build (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target aarch64-unknown-linux-gnu --locked

      # Repository mutation is Linux-only (DC-37); both matrix targets are Linux, so no
      # download-surface mutation-limit statement is needed for these artifacts.
      - name: Package (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/prikk stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/prikk-x86_64-unknown-linux-gnu.tar.gz prikk LICENSE
          ( cd dist && sha256sum prikk-x86_64-unknown-linux-gnu.tar.gz > prikk-x86_64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: x86_64-unknown-linux-gnu" > dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p prikk --release --target x86_64-unknown-linux-gnu --locked" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
      - name: Package (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/aarch64-unknown-linux-gnu/release/prikk stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/prikk-aarch64-unknown-linux-gnu.tar.gz prikk LICENSE
          ( cd dist && sha256sum prikk-aarch64-unknown-linux-gnu.tar.gz > prikk-aarch64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: aarch64-unknown-linux-gnu" > dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p prikk --release --target aarch64-unknown-linux-gnu --locked" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt

      - uses: actions/upload-artifact@v7
        with:
          name: prikk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # RFC 107 Stage 1: notes are assembled from CHANGELOG.md and dist/*.build-info.txt at
      # publish time rather than restated in a static file — a static file is what let the
      # platform claim go stale (rfcs/accepted/107-release-distribution-surface.md §0). $TAG is
      # not enumerable in advance, so the scanner (procedure.rs's release_notes_procedure) matches
      # on shape: every other token fixed, $TAG free to vary but the same token release-policy
      # itself will read from the environment below.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run -p prikk-release-policy --locked -- release-notes "$TAG" dist > release-notes.md

      # $TAG and the repository slug are written out as the literal tokens the scanner sees
      # (procedure.rs's gh() match), not templated — the tag itself cannot be enumerated in
      # advance the way the two build targets above are, so the match is on shape: a fixed
      # `release create`, the fixed asset globs, and the fixed --repo/--notes-file values, with
      # $TAG free to vary but required identical in both places it appears.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.build-info.txt --repo nabbisen/prikk --title "$TAG" --notes-file release-notes.md
