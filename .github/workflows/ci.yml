name: CI

on:
  push:
  pull_request:

jobs:
  stable:
    name: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # release-policy's boundary check runs `cargo metadata --locked --offline`, which resolves
        # the graph for ALL targets — including deps a host-only build never fetches (e.g. bumpalo,
        # reached through a non-host target). `cargo fetch` without `--target` fetches every target's
        # dependencies, so `--offline` is satisfiable. Keeping `--offline` in the gate is deliberate:
        # it is a hermeticity property, and the environment should meet it rather than the gate relax.
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv-1-85-0:
    name: msrv-1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Fetch dependencies for every target
        # release-policy's boundary check runs `cargo metadata --locked --offline`, which resolves
        # the graph for ALL targets — including deps a host-only build never fetches (e.g. bumpalo,
        # reached through a non-host target). `cargo fetch` without `--target` fetches every target's
        # dependencies, so `--offline` is satisfiable. Keeping `--offline` in the gate is deliberate:
        # it is a hermeticity property, and the environment should meet it rather than the gate relax.
        run: cargo fetch --locked
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

  # DC-71: repository mutation is Linux-only, but read-only commands (see
  # docs/src/reference/platform-support.md for the full, traced list) must build and run on other
  # platforms. This job is the property that stops that boundary rotting silently again — nothing
  # built a non-Linux target before DC-71, which is how the prior defect shipped undetected.
  non-linux-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: non-linux build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked

  # DC-81: repository mutation is Linux-and-macOS now (DC-76's contract ported), but this is the
  # *only* verification available for it — neither developer nor architect can run macOS locally
  # (DC-81 handoff §3). This job existing and being green is itself the DC-81 §5 stop condition: no
  # gate is relaxed in a merged commit before it does. A green run proves prikk's own failure-handling
  # behaviour on macOS; it does not and cannot prove the OS actually persisted anything, since a CI
  # runner cannot be power-cycled — that limit is stated here, not discovered later.
  macos-mutation:
    name: macOS mutation test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # DC-81 addendum-2 B1: without this, boundary::tests::workspace_and_product_boundaries_hold
        # fails — that test runs `cargo metadata --locked --offline`, which needs every target's
        # dependency graph already cached (DC-71's same requirement, matching lines 20/40 above).
        run: cargo fetch --locked
      - name: Test
        run: cargo test --workspace --locked
      # DC-81 addendum-1 §3: Q3's measurement is follow-through, not optional. `#[ignore]`d so it
      # never affects the gate above; run by name so only this one data-collection test executes,
      # not every `#[ignore]`d test in the workspace.
      - name: Measure fsync vs fcntl_fullfsync (NFR-PERF-01 data point, not a gate)
        run: cargo test --workspace --locked -- measure_directory_sync_fsync_vs_fcntl_fullfsync --ignored --nocapture

  # DC-87 Stage 2: repository mutation is Linux, macOS, and Windows now — this is the *only*
  # verification available for the Windows backend, mirroring macos-mutation above for the same
  # reason (DC-81 handoff §3, applying identically to Windows): neither developer nor architect can
  # run Windows locally as part of this project's own environment. A green run here proves prikk's
  # own path-resolution and failure-handling behaviour on Windows; criterion 2 (every guarantee held
  # or documented weaker) is not provable from a compile alone — this job exercises it.
  windows-mutation:
    name: Windows mutation test suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # DC-81 addendum-2 B1's finding, confirmed to apply identically here (see lines 20/40/83):
        # without this, boundary::tests::workspace_and_product_boundaries_hold fails.
        run: cargo fetch --locked
      - name: Test
        run: cargo test --workspace --locked

  # A fixture repository is authored on Linux and handed to the non-linux-verify job below, which
  # proves the read-only command set actually runs elsewhere — criterion 2 asks for this
  # demonstrated, not merely a successful compile. (Mutation is no longer Linux-only — DC-81 added
  # macOS, DC-87 added Windows — but authoring the fixture here, once, keeps this job's own
  # dependency on `windows-mutation`/`macos-mutation` for mutation coverage rather than duplicating
  # it.)
  fixture:
    name: build read-only fixture repository
    runs-on: ubuntu-latest
    env:
      PRIKK_AUTHOR_KEY_ID: dev-author
      PRIKK_AUTHOR_SEED: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PRIKK_MAINTAINER_KEY_ID: dev-maintainer
      PRIKK_MAINTAINER_SEED: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - name: Author the fixture repository
        run: |
          mkdir -p fixture-repo
          target/debug/prikk init fixture-repo
          cd fixture-repo
          ../target/debug/prikk trust maintainer add \
            --key-id "$PRIKK_MAINTAINER_KEY_ID" \
            --public-key a00899dfd3357aee69729405913f9324dfc033cec04a2215239eda64ae6d9d91
          echo "hello prikk" > readme.txt
          ../target/debug/prikk commit -m genesis
          ../target/debug/prikk seal --allow-no-audit
      # DC-71 B2 ruling: actions/upload-artifact's zip does not preserve empty directories (e.g.
      # refs/tmp, a required-but-empty directory — layout.rs), so the conformance job downloaded a
      # silently corrupted repository and never tested a valid one. tar preserves them; the zip
      # transport does not. Confirmed by a negative control: removing refs/tmp from a valid
      # fixture on Linux reproduces the exact "directory is absent: refs/tmp" error the
      # conformance job reported.
      - name: Package the fixture repository
        run: tar -czf fixture-repo.tar.gz -C fixture-repo .
      - uses: actions/upload-artifact@v7
        with:
          name: read-only-fixture-repo
          path: fixture-repo.tar.gz
          if-no-files-found: error

  non-linux-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: non-linux read-only conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fixture
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - uses: actions/download-artifact@v8
        with:
          name: read-only-fixture-repo
      # tar, not the artifact zip, is what preserves the fixture's required-but-empty directories
      # (see the fixture job's Package step) — extracted with bash/tar on every runner, including
      # Windows, where GH-hosted runners ship a bsdtar-compatible tar.exe.
      - name: Unpack the fixture repository
        shell: bash
        run: |
          mkdir -p fixture-repo
          tar -xzf fixture-repo.tar.gz -C fixture-repo
      # worktree-status is excluded here, not because it mutates, but because it currently
      # requires snapshot-block state that no CLI command can produce against an ordinary
      # patch/WAL-authored repository (see docs/src/reference/platform-support.md) — the fixture
      # below is genesis-and-seal, exactly what `prikk commit`/`prikk seal` actually produce.
      #
      # DC-71 B2: each command is echoed and separately checked (rather than one bash -e block)
      # so a failure names the exact command that failed, not just "something in this sequence" —
      # the ambiguity that made the first B2 report unable to isolate which of these three failed.
      - name: Run the read-only command set against the fixture
        shell: bash
        run: |
          cd fixture-repo
          echo "=== prikk log ==="
          ../target/debug/prikk log
          echo "=== prikk status ==="
          ../target/debug/prikk status
          echo "=== prikk verify ==="
          ../target/debug/prikk verify
          echo "=== prikk doctor ==="
          ../target/debug/prikk doctor
          echo "=== prikk branch list ==="
          ../target/debug/prikk branch list
          echo "=== prikk tag list ==="
          ../target/debug/prikk tag list
          echo "=== prikk checkout --plan-only ==="
          ../target/debug/prikk checkout --plan-only
          echo "=== all read-only commands succeeded ==="
