name: CI

on:
  push:
  pull_request:

jobs:
  stable:
    name: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # release-policy's boundary check runs `cargo metadata --locked --offline`, which resolves
        # the graph for ALL targets — including deps a host-only build never fetches (e.g. bumpalo,
        # reached through a non-host target). `cargo fetch` without `--target` fetches every target's
        # dependencies, so `--offline` is satisfiable. Keeping `--offline` in the gate is deliberate:
        # it is a hermeticity property, and the environment should meet it rather than the gate relax.
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv-1-85-0:
    name: msrv-1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Fetch dependencies for every target
        # release-policy's boundary check runs `cargo metadata --locked --offline`, which resolves
        # the graph for ALL targets — including deps a host-only build never fetches (e.g. bumpalo,
        # reached through a non-host target). `cargo fetch` without `--target` fetches every target's
        # dependencies, so `--offline` is satisfiable. Keeping `--offline` in the gate is deliberate:
        # it is a hermeticity property, and the environment should meet it rather than the gate relax.
        run: cargo fetch --locked
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

  # DC-71: repository mutation is Linux-only, but read-only commands (see
  # docs/src/reference/platform-support.md for the full, traced list) must build and run on other
  # platforms. This job is the property that stops that boundary rotting silently again — nothing
  # built a non-Linux target before DC-71, which is how the prior defect shipped undetected.
  non-linux-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: non-linux build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked

  # DC-81: repository mutation is Linux-and-macOS now (DC-76's contract ported), but this is the
  # *only* verification available for it — neither developer nor architect can run macOS locally
  # (DC-81 handoff §3). This job existing and being green is itself the DC-81 §5 stop condition: no
  # gate is relaxed in a merged commit before it does. A green run proves prikk's own failure-handling
  # behaviour on macOS; it does not and cannot prove the OS actually persisted anything, since a CI
  # runner cannot be power-cycled — that limit is stated here, not discovered later.
  macos-mutation:
    name: macOS mutation test suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # DC-81 addendum-2 B1: without this, boundary::tests::workspace_and_product_boundaries_hold
        # fails — that test runs `cargo metadata --locked --offline`, which needs every target's
        # dependency graph already cached (DC-71's same requirement, matching lines 20/40 above).
        run: cargo fetch --locked
      # DC-87 Stage 2, fourth CI run: `cargo test` stops at the first failing test binary by default,
      # so a Linux/macOS/Windows-specific failure hides every failure behind it -- three straight runs
      # each surfaced exactly one new layer instead of the whole set. `--no-fail-fast` trades a single
      # green/red signal for the complete inventory in one run.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # DC-81 addendum-1 §3: Q3's measurement is follow-through, not optional. `#[ignore]`d so it
      # never affects the gate above; run by name so only this one data-collection test executes,
      # not every `#[ignore]`d test in the workspace.
      - name: Measure fsync vs fcntl_fullfsync (NFR-PERF-01 data point, not a gate)
        run: cargo test --workspace --locked -- measure_directory_sync_fsync_vs_fcntl_fullfsync --ignored --nocapture

  # DC-87 Stage 2: repository mutation is Linux, macOS, and Windows now — this is the *only*
  # verification available for the Windows backend, mirroring macos-mutation above for the same
  # reason (DC-81 handoff §3, applying identically to Windows): neither developer nor architect can
  # run Windows locally as part of this project's own environment. A green run here proves prikk's
  # own path-resolution and failure-handling behaviour on Windows; criterion 2 (every guarantee held
  # or documented weaker) is not provable from a compile alone — this job exercises it.
  windows-mutation:
    name: Windows mutation test suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for every target
        # DC-81 addendum-2 B1's finding, confirmed to apply identically here (see lines 20/40/83):
        # without this, boundary::tests::workspace_and_product_boundaries_hold fails.
        run: cargo fetch --locked
      # DC-87 Stage 2, fourth CI run: see macos-mutation's own comment above -- fail-fast has cost one
      # full CI cycle per newly-reachable layer for three runs straight; --no-fail-fast gets the whole
      # inventory in one.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  # A fixture repository is authored on Linux and handed to the non-linux-verify job below, which
  # proves the read-only command set actually runs elsewhere — criterion 2 asks for this
  # demonstrated, not merely a successful compile. (Mutation is no longer Linux-only — DC-81 added
  # macOS, DC-87 added Windows — but authoring the fixture here, once, keeps this job's own
  # dependency on `windows-mutation`/`macos-mutation` for mutation coverage rather than duplicating
  # it.)
  fixture:
    name: build read-only fixture repository
    runs-on: ubuntu-latest
    env:
      PRIKK_AUTHOR_KEY_ID: dev-author
      PRIKK_AUTHOR_SEED: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PRIKK_MAINTAINER_KEY_ID: dev-maintainer
      PRIKK_MAINTAINER_SEED: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      # DC-89: a realistic small project's worth of history, not a single genesis commit -- still
      # authored with the real binary, still on Linux. Two commits on heads/main (a create, then
      # an edit to the *same* file -- an edit exercises replay and anchoring that a create alone
      # never touches); a short-lived heads/docs branch with its own sealed commit, then closed
      # ("not delete -- pointer, history, and objects stay", per its own help text -- exactly the
      # state worth carrying across this boundary); a tag at heads/main's current tip. Everything
      # here is sealed -- see the worktree-pollution note below for why.
      #
      # DC-89 worktree-pollution fix: heads/docs's own commit EDITS readme.txt -- it does not
      # create a second file. This tool shares one worktree across every ref (there is no
      # per-branch checkout yet); a second file (`docs.txt`, this step's first attempt) sits in the
      # worktree, unremoved, after heads/docs is closed -- it reads as a *new* file to
      # windows-mutate's and linux-mutate-reference's own commit against heads/main,
      # which run against this exact fixture later. A new file means a CreateFile operation, which
      # mints a fresh NodeId from the OS CSPRNG (node_id_gen.rs) -- different per platform by
      # design, so the two mutation jobs produced different blocks from "the same" mutation and
      # verify-cross-platform-history failed on main (root-caused and reproduced locally: two
      # independent runs of the same mutation against the polluted fixture minted two different
      # node ids and produced two different blocks on the same machine, before this fix). Editing
      # readme.txt again on heads/docs leaves nothing extra in the worktree, so the later mutation
      # jobs see only their own single append and mint no node id at all.
      - name: Author the fixture repository
        run: |
          mkdir -p fixture-repo
          target/debug/prikk init fixture-repo
          cd fixture-repo
          ../target/debug/prikk trust maintainer add \
            --key-id "$PRIKK_MAINTAINER_KEY_ID" \
            --public-key a00899dfd3357aee69729405913f9324dfc033cec04a2215239eda64ae6d9d91
          echo "hello prikk" > readme.txt
          ../target/debug/prikk commit -m genesis
          ../target/debug/prikk seal --allow-no-audit
          echo "a small history to prove replay and anchoring across platforms" >> readme.txt
          ../target/debug/prikk commit -m "expand readme"
          ../target/debug/prikk seal --allow-no-audit
          ../target/debug/prikk branch create heads/docs --from heads/main
          echo "see also: the docs branch, opened to work out how this section should read" >> readme.txt
          ../target/debug/prikk commit --ref heads/docs -m "note the docs branch in the readme"
          ../target/debug/prikk seal --allow-no-audit --ref heads/docs
          ../target/debug/prikk branch close heads/docs
          ../target/debug/prikk tag create tags/v1 --target heads/main
      # DC-71 B2 ruling: actions/upload-artifact's zip does not preserve empty directories (e.g.
      # refs/tmp, a required-but-empty directory — layout.rs), so the conformance job downloaded a
      # silently corrupted repository and never tested a valid one. tar preserves them; the zip
      # transport does not. Confirmed by a negative control: removing refs/tmp from a valid
      # fixture on Linux reproduces the exact "directory is absent: refs/tmp" error the
      # conformance job reported.
      - name: Package the fixture repository
        run: tar -czf fixture-repo.tar.gz -C fixture-repo .
      - uses: actions/upload-artifact@v7
        with:
          name: read-only-fixture-repo
          path: fixture-repo.tar.gz
          if-no-files-found: error

  non-linux-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: non-linux read-only conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fixture
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - uses: actions/download-artifact@v8
        with:
          name: read-only-fixture-repo
      # tar, not the artifact zip, is what preserves the fixture's required-but-empty directories
      # (see the fixture job's Package step) — extracted with bash/tar on every runner, including
      # Windows, where GH-hosted runners ship a bsdtar-compatible tar.exe.
      - name: Unpack the fixture repository
        shell: bash
        run: |
          mkdir -p fixture-repo
          tar -xzf fixture-repo.tar.gz -C fixture-repo
      # worktree-status is excluded here, not because it mutates, but because it currently
      # requires snapshot-block state that no CLI command can produce against an ordinary
      # patch/WAL-authored repository (see docs/src/reference/platform-support.md) — the fixture
      # below is genesis-and-seal, exactly what `prikk commit`/`prikk seal` actually produce.
      #
      # DC-71 B2: each command is echoed and separately checked (rather than one bash -e block)
      # so a failure names the exact command that failed, not just "something in this sequence" —
      # the ambiguity that made the first B2 report unable to isolate which of these three failed.
      - name: Run the read-only command set against the fixture
        shell: bash
        run: |
          cd fixture-repo
          echo "=== prikk log ==="
          ../target/debug/prikk log
          echo "=== prikk status ==="
          ../target/debug/prikk status
          echo "=== prikk verify ==="
          ../target/debug/prikk verify
          echo "=== prikk doctor ==="
          ../target/debug/prikk doctor
          echo "=== prikk branch list ==="
          ../target/debug/prikk branch list
          echo "=== prikk tag list ==="
          ../target/debug/prikk tag list
          echo "=== prikk checkout --plan-only ==="
          ../target/debug/prikk checkout --plan-only
          echo "=== all read-only commands succeeded ==="

  # DC-87 Stage 2 review, criterion 7: "the criterion that proves the port rather than the code."
  # Every test elsewhere in this workflow is one platform verifying itself; this is the one place a
  # Windows-authored object is checked by a different platform's own re-derivation. Reuses the
  # fixture job's own deterministic seeds so the mutation performed here is reproducible bit-for-bit
  # by linux-mutate-reference below.
  #
  # The mutation is an EDIT to the fixture's already-existing readme.txt, deliberately not a new
  # file. Object ids are deterministic given identical canonical bytes, but a *fresh* node's id is
  # not part of that: `NodeIdGenerator`'s production entropy source mints it via `getrandom` (real
  # OS randomness, no seed), by design, and minting only happens for a fresh node
  # (`node_authoring.rs`'s own doc: "fresh nodes are minted through NodeIdGenerator"). Editing an
  # already-existing node reuses its established id from the baseline — no fresh entropy anywhere in
  # its canonical bytes — which is what actually makes two independent runs comparable. Confirmed
  # locally before relying on it: two independent edits from a shared baseline produced identical
  # block ids; two independent *creates* did not, even run twice on the same machine. **Consequence
  # worth stating plainly: this comparison does not, and cannot, cross-check node *creation* on
  # Windows — that path is still exercised by the `Windows mutation test suite` above, just not
  # id-compared here, because a created node's id is random by design on every platform.**
  windows-mutate:
    name: mutate the fixture on Windows
    runs-on: windows-latest
    needs: fixture
    env:
      PRIKK_AUTHOR_KEY_ID: dev-author
      PRIKK_AUTHOR_SEED: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PRIKK_MAINTAINER_KEY_ID: dev-maintainer
      PRIKK_MAINTAINER_SEED: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - uses: actions/download-artifact@v8
        with:
          name: read-only-fixture-repo
      - name: Unpack the fixture repository
        shell: bash
        run: |
          mkdir -p fixture-repo
          tar -xzf fixture-repo.tar.gz -C fixture-repo
      # `shell: bash` throughout, not the pwsh default — Git Bash's `echo` writes LF, matching
      # linux-mutate-reference's own `echo`, so the two platforms author byte-identical content
      # rather than diverging on line endings for a reason that has nothing to do with what this
      # job exists to check.
      - name: Mutate the fixture on Windows
        shell: bash
        run: |
          cd fixture-repo
          echo "cross-platform history check" >> readme.txt
          ../target/debug/prikk commit -m cross-platform-history-check
          ../target/debug/prikk seal --allow-no-audit
      - name: Record the resulting object ids
        shell: bash
        run: |
          cd fixture-repo
          ../target/debug/prikk log | grep "^block " | sort > ../windows-object-ids.txt
          cat ../windows-object-ids.txt
      - name: Package the mutated repository
        shell: bash
        run: tar -czf windows-mutated-repo.tar.gz -C fixture-repo .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-mutated-repo
          path: |
            windows-mutated-repo.tar.gz
            windows-object-ids.txt
          if-no-files-found: error

  # The independent reference computation "identical object ids" is compared against. Not a second
  # run of `prikk verify`'s own re-derivation (that happens in verify-cross-platform-history below,
  # against the Windows-produced repository directly) — this is a value computed with no dependency
  # on anything Windows claimed, from the same original fixture and the same deterministic mutation.
  linux-mutate-reference:
    name: mutate the fixture on Linux (reference)
    runs-on: ubuntu-latest
    needs: fixture
    env:
      PRIKK_AUTHOR_KEY_ID: dev-author
      PRIKK_AUTHOR_SEED: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PRIKK_MAINTAINER_KEY_ID: dev-maintainer
      PRIKK_MAINTAINER_SEED: "111122223333444455556666777788889999aaaabbbbccccddddeeeeffff0000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - uses: actions/download-artifact@v8
        with:
          name: read-only-fixture-repo
      - name: Unpack the fixture repository
        run: |
          mkdir -p fixture-repo
          tar -xzf fixture-repo.tar.gz -C fixture-repo
      - name: Mutate the fixture identically on Linux
        run: |
          cd fixture-repo
          echo "cross-platform history check" >> readme.txt
          ../target/debug/prikk commit -m cross-platform-history-check
          ../target/debug/prikk seal --allow-no-audit
      - name: Record the resulting object ids
        run: |
          cd fixture-repo
          ../target/debug/prikk log | grep "^block " | sort > ../linux-object-ids.txt
          cat ../linux-object-ids.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-object-ids
          path: linux-object-ids.txt
          if-no-files-found: error

  # Closes DC-87 Stage 2 criterion 7. A repository authored on Linux, mutated on Windows, and
  # verified on Linux must produce identical object ids and a clean `verify` — demonstrated here end
  # to end, not reasoned about from a green compile on either side.
  #
  # The object-id comparison below compares two *independent* mutations, run at different
  # wall-clock times on different runners. "No clock in the preimage" is necessary but not
  # sufficient for that to be meaningful — determinism also requires no *random* input anywhere in
  # the compared bytes, and `windows-mutate`'s own comment explains why that is exactly what an edit
  # to an already-existing node gives (no fresh `NodeId` minted) that creating one would not. Two
  # things, not one, make the comparison valid:
  #   1. No clock: `BlockPayload` has no timestamp field; the only `created_at`
  #      (inside a `Signature`, not the object's own canonical payload — see `envelope.rs`'s
  #      `object_id()`, which hashes only `object_type`/`schema_version`/`canonical_payload`) is a
  #      documented no-clock sentinel and is not part of object identity at all. Ed25519 signing is
  #      deterministic, so the same fixed seed on both sides produces the same signature bytes.
  #   2. No fresh entropy: both jobs edit `readme.txt`, never create a new file. A created node's id
  #      is `getrandom`-sourced by design and would never match across independent runs, on any
  #      platform, even twice on the same machine — confirmed locally before this job existed in its
  #      current form.
  # If a real timestamp is ever added to an object preimage, or the mutation is ever changed back to
  # creating a file, this job starts failing for a reason that has nothing to do with platform
  # divergence — the fix at that point is to change what is compared or restore the edit, never to
  # weaken or drop this comparison, which is the only check in this workflow that proves Windows and
  # Linux agree rather than merely that each is internally consistent with itself. **This comparison
  # does not and cannot cross-check node *creation* on Windows — a created node's id is random by
  # design on every platform. Creation is still exercised by `Windows mutation test suite` above; it
  # is simply not part of what this job compares.**
  verify-cross-platform-history:
    name: cross-platform history identity (Windows mutation, Linux verification)
    runs-on: ubuntu-latest
    needs: [windows-mutate, linux-mutate-reference]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build -p prikk --locked
      - uses: actions/download-artifact@v8
        with:
          name: windows-mutated-repo
      - uses: actions/download-artifact@v8
        with:
          name: linux-object-ids
      - name: Unpack the Windows-mutated repository
        run: |
          mkdir -p windows-repo
          tar -xzf windows-mutated-repo.tar.gz -C windows-repo
      - name: Verify the Windows-mutated repository on Linux
        run: |
          cd windows-repo
          ../target/debug/prikk verify
      # `diff`'s own non-zero exit on a mismatch already fails this step, the same way `prikk
      # verify`'s non-zero exit already fails the step above with no explicit `if`/`exit` wrapper —
      # matching that pattern rather than reintroducing one keeps this to a single governed command.
      - name: Compare object ids — Windows-computed against the independent Linux reference
        run: diff -u linux-object-ids.txt windows-object-ids.txt && echo "=== object ids identical across platforms ==="
