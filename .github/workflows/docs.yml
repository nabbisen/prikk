name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # manual run
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # RFC 137 §7 increment 3: staged outside the repository tree so nothing new appears under
      # docs/ -- no .gitignore entry needed, and a local run cannot leave a third directory beside
      # src/ and book/.
      SITE_DIR: ${{ runner.temp }}/site

    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: cargo install mdbook --no-default-features --features search --vers "^0.5" --locked

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --vers "^0.17" --locked

      - name: Build book
        run: mdbook build

      # RFC 137 §7 increment 3: the landing page (docs/landing/) is the site root, the built book
      # goes under /docs/. docs.yml's own `paths:` filter is already `docs/**`, so docs/landing/
      # needs no filter change.
      - name: Stage site
        run: |
          mkdir -p "$SITE_DIR"
          cp -r landing/. "$SITE_DIR/"
          mkdir -p "$SITE_DIR/docs"
          cp -r book/. "$SITE_DIR/docs/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
